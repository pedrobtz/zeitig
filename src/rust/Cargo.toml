[package]
name = "zeitig"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
savvy = "0.11"
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "tz-system",
    "tz-fat",
    "tzdb-zoneinfo",
    "tzdb-bundle-platform",
    "perf-inline",
] }

[profile.release]
# By default, on release build, savvy terminates the R session when a panic
# occurs. A panic means a bug (never `unwrap()` on user input), so aborting is
# the right behaviour; see design.md "Error handling".
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
